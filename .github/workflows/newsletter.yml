name: Send new post newsletter

on:
  repository_dispatch:
    types: [vercel.deployment.success]

jobs:
  send:
    if: github.event.client_payload.environment == 'production' && github.event.client_payload.git.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Send published posts
        run: node scripts/send-new-posts.mjs
        env:
          GIT_SHA: ${{ github.event.client_payload.git.sha }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
