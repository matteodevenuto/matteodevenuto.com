<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{POST_TITLE}}</title>
    <style>
      @font-face { font-family: Atkinson; src: url("https://matteodevenuto.com/fonts/atkinson-regular.woff") format("woff"); font-weight: 400; }
      @font-face { font-family: Atkinson; src: url("https://matteodevenuto.com/fonts/atkinson-bold.woff") format("woff"); font-weight: 700; }
      pre code { color:#282728 !important; background:transparent !important; padding:0 !important; }
      @media (max-width: 540px) {
        .email-card { padding:32px 22px !important; }
        .email-title { font-size:29px !important; }
      }
    </style>
  </head>
  <body style="margin:0;background:#f3f5fa;color:#282728;font-family:Atkinson,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0">
      {{POST_DESCRIPTION}}
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f5fa">
      <tr>
        <td align="center" style="padding:36px 14px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:680px">
            <tr>
              <td style="padding:0 4px 22px">
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td>
                      <a href="https://matteodevenuto.com">
                        <img src="https://matteodevenuto.com/favicon.png" width="36" height="36" alt="" style="display:block;border:0;border-radius:7px">
                      </a>
                    </td>
                    <td style="padding-left:10px">
                      <a href="https://matteodevenuto.com" style="color:#282728;text-decoration:none;font-size:18px;font-weight:700">
                        Matteo De Venuto
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td class="email-card" style="background:#fdfdfd;border:1px solid #e6e6e6;border-top:4px solid #5181fb;border-radius:10px;padding:44px 46px">
                <p style="margin:0 0 28px;color:#56545a;font-size:16px;line-height:1.6">
                  Hi {{{contact.first_name|there}}},
                </p>
                <p style="margin:0 0 12px;color:#5181fb;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">
                  New post
                </p>
                <h1 class="email-title" style="margin:0 0 16px;color:#5181fb;font-size:34px;line-height:1.16;letter-spacing:-.02em">
                  {{POST_TITLE}}
                </h1>
                <p style="margin:0 0 32px;color:#56545a;font-size:18px;line-height:1.65">
                  {{POST_DESCRIPTION}}
                </p>
                {{POST_HERO}}
                <div style="color:#282728;font-size:17px;line-height:1.75">
                  {{POST_CONTENT}}
                </div>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin-top:38px;border-top:1px dashed #5181fb">
                  <tr>
                    <td style="padding-top:28px">
                      <a href="{{POST_URL}}" style="display:inline-block;padding:13px 20px;border-radius:6px;background:#5181fb;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700">
                        Read on the blog &rarr;
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 4px;color:#68676c;font-size:12px;line-height:1.6">
                <p style="margin:0 0 8px">
                  You received this because you subscribed at matteodevenuto.com.
                </p>
                <p style="margin:0">
                  <a href="{{{RESEND_UNSUBSCRIBE_URL}}}" style="color:#5181fb">Unsubscribe</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
