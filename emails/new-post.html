<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{POST_TITLE}}</title>
  </head>
  <body style="margin:0;background:#f4f6f8;color:#212529;font-family:Arial,Helvetica,sans-serif">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0">
      {{POST_DESCRIPTION}}
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8">
      <tr>
        <td align="center" style="padding:40px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px">
            <tr>
              <td style="padding:0 4px 24px">
                <a href="https://matteodevenuto.com" style="color:#212529;text-decoration:none;font-size:18px;font-weight:700">
                  Matteo De Venuto
                </a>
              </td>
            </tr>
            <tr>
              <td style="background:#ffffff;border:1px solid #e2e6ea;border-radius:16px;padding:40px">
                <p style="margin:0 0 24px;color:#5f6873;font-size:16px;line-height:1.6">
                  Hi {{{contact.first_name|there}}},
                </p>
                <p style="margin:0 0 12px;color:#006cac;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">
                  New post
                </p>
                <h1 style="margin:0 0 20px;color:#212529;font-size:32px;line-height:1.2;letter-spacing:-.02em">
                  {{POST_TITLE}}
                </h1>
                <p style="margin:0 0 30px;color:#5f6873;font-size:17px;line-height:1.7">
                  {{POST_DESCRIPTION}}
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="border-radius:8px;background:#006cac">
                      <a href="{{POST_URL}}" style="display:inline-block;padding:14px 22px;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700">
                        Read the post &rarr;
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 4px;color:#7a838d;font-size:12px;line-height:1.6">
                <p style="margin:0 0 8px">
                  You received this because you subscribed at matteodevenuto.com.
                </p>
                <p style="margin:0">
                  <a href="{{{RESEND_UNSUBSCRIBE_URL}}}" style="color:#7a838d">Unsubscribe</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
